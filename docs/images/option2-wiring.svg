<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="900" height="450" fill="#ffffff"/>
  <text x="450" y="18" text-anchor="middle" font-size="15" font-weight="bold">Option 2: ESP32 on the VSC's LINUX TERMINAL header, powered from the bus cable</text>

  <!-- bus cable -->
  <text x="20" y="96" fill="#333">bus cable from the unit</text>
  <g stroke-width="4" fill="none">
    <path d="M20,110 H180" stroke="#d00000"/>
    <path d="M20,130 H180" stroke="#1060d0"/>
    <path d="M20,150 H180" stroke="#e0b000"/>
    <path d="M20,170 H180" stroke="#109030"/>
    <path d="M120,110 V45 H520" stroke="#d00000"/>
    <path d="M140,130 V75 H520" stroke="#1060d0"/>
  </g>
  <circle cx="120" cy="110" r="5" fill="#d00000"/>
  <circle cx="140" cy="130" r="5" fill="#1060d0"/>
  <g font-size="11">
    <text x="24" y="124">red +10 V</text>
    <text x="24" y="144">blue 0 V</text>
    <text x="24" y="164">yellow A</text>
    <text x="24" y="184">green B</text>
  </g>

  <!-- VSC board -->
  <rect x="180" y="90" width="260" height="290" rx="8" fill="#f7e9e9" stroke="#8a2020" stroke-width="2"/>
  <text x="310" y="370" text-anchor="middle" font-weight="bold">VSC board</text>
  <rect x="180" y="100" width="110" height="80" fill="#dddddd" stroke="#555"/>
  <text x="235" y="135" text-anchor="middle" font-size="12">grey bus</text>
  <text x="235" y="150" text-anchor="middle" font-size="12">connector</text>
  <rect x="395" y="225" width="45" height="120" fill="#222" rx="3"/>
  <g fill="#ffffff" font-size="12" text-anchor="middle">
    <text x="417" y="244">0V</text>
    <text x="417" y="294">TX</text>
    <text x="417" y="334">RX</text>
  </g>
  <text x="385" y="270" text-anchor="end" font-size="12">LINUX TERMINAL</text>
  <text x="385" y="285" text-anchor="end" font-size="11" fill="#555">(next to the SD card,</text>
  <text x="385" y="299" text-anchor="end" font-size="11" fill="#555">0V nearest the blue sticker)</text>

  <!-- buck regulator -->
  <rect x="520" y="25" width="160" height="70" rx="6" fill="#f3ead0" stroke="#9a7a10" stroke-width="2"/>
  <text x="600" y="50" text-anchor="middle" font-weight="bold">5 V buck module</text>
  <text x="600" y="66" text-anchor="middle" font-size="11">(LM2596 type)</text>
  <text x="600" y="82" text-anchor="middle" font-size="11">set to 5.0 V first</text>
  <g font-size="10">
    <text x="524" y="41">IN+</text>
    <text x="524" y="88">IN−</text>
    <text x="676" y="41" text-anchor="end">OUT+</text>
    <text x="676" y="88" text-anchor="end">OUT−</text>
  </g>

  <!-- ESP32 -->
  <rect x="720" y="150" width="160" height="230" rx="8" fill="#e6eef8" stroke="#204a80" stroke-width="2"/>
  <text x="800" y="370" text-anchor="middle" font-weight="bold">ESP32 dev board</text>
  <g font-size="12">
    <text x="728" y="184">VIN (5 V)</text>
    <text x="728" y="224">GND</text>
    <text x="728" y="294">GPIO16 (RX)</text>
    <text x="728" y="334">GPIO17 (TX)</text>
  </g>

  <!-- power -->
  <g stroke-width="3" fill="none">
    <path d="M680,45 H700 V180 H720" stroke="#d00000"/>
    <path d="M680,75 H690 V220 H720" stroke="#000000"/>
    <path d="M440,240 H690 V220" stroke="#000000"/>
  </g>
  <circle cx="690" cy="220" r="5" fill="#000"/>

  <!-- console -->
  <g stroke-width="3" fill="none">
    <path d="M440,290 H540" stroke="#c06000"/>
    <path d="M600,290 H720" stroke="#c06000"/>
    <path d="M720,330 H440" stroke="#6a2bb0"/>
  </g>
  <rect x="540" y="280" width="60" height="20" fill="#f0e0c0" stroke="#c06000" stroke-width="2"/>
  <text x="570" y="274" text-anchor="middle" font-size="12" font-weight="bold">10 kΩ</text>
  <polygon points="640,284 652,290 640,296" fill="#c06000"/>
  <polygon points="520,324 508,330 520,336" fill="#6a2bb0"/>

  <g font-size="12">
    <text x="20" y="410">• Red +10 V goes only to the buck module's IN+, never to an ESP pin. Blue 0 V, the buck's IN−/OUT− and ESP GND are one ground.</text>
    <text x="20" y="428">• VSC TX → 10 kΩ → GPIO16. GPIO17 → VSC RX directly. Bridge polarity: RS232 (inverted), the firmware default.</text>
    <text x="20" y="446">• Alternative to the resistor: a 3.3 V MAX3232 module between the header and the ESP, with the bridge set to TTL (normal).</text>
  </g>
</svg>

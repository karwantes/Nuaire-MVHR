<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="860" height="400" fill="#ffffff"/>

  <!-- VSC board -->
  <rect x="20" y="60" width="180" height="200" rx="6" fill="#f4f4f4" stroke="#555" stroke-width="1.5"/>
  <text x="110" y="82" text-anchor="middle" font-weight="600" fill="#1a1a1a">VSC board</text>
  <text x="110" y="100" text-anchor="middle" fill="#444">LINUX TERMINAL header</text>
  <text x="110" y="116" text-anchor="middle" fill="#444">(next to the SD card)</text>
  <text x="190" y="144" text-anchor="end" fill="#1a1a1a">0V</text>
  <text x="190" y="184" text-anchor="end" fill="#1a1a1a">TX</text>
  <text x="190" y="224" text-anchor="end" fill="#999">RX</text>
  <text x="110" y="250" text-anchor="middle" font-size="11" fill="#999">RX: not connected</text>

  <!-- ESP32 -->
  <rect x="640" y="60" width="180" height="200" rx="6" fill="#f4f4f4" stroke="#555" stroke-width="1.5"/>
  <text x="730" y="82" text-anchor="middle" font-weight="600" fill="#1a1a1a">ESP32 dev board</text>
  <text x="730" y="100" text-anchor="middle" fill="#444">vsc-serial-bridge</text>
  <text x="650" y="144" fill="#1a1a1a">GND</text>
  <text x="650" y="184" fill="#1a1a1a">GPIO16 (RX)</text>
  <text x="650" y="224" fill="#999">GPIO17 (TX)</text>
  <text x="730" y="250" text-anchor="middle" font-size="11" fill="#999">GPIO17: not connected</text>

  <!-- GND wire -->
  <line x1="200" y1="140" x2="640" y2="140" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="200" cy="140" r="4" fill="#1a1a1a"/><circle cx="640" cy="140" r="4" fill="#1a1a1a"/>

  <!-- TX wire with 10k resistor -->
  <line x1="200" y1="180" x2="370" y2="180" stroke="#2f855a" stroke-width="2.5"/>
  <polyline points="370,180 378,170 394,190 410,170 426,190 442,170 458,190 470,180" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="470" y1="180" x2="640" y2="180" stroke="#2f855a" stroke-width="2.5"/>
  <circle cx="200" cy="180" r="4" fill="#2f855a"/><circle cx="640" cy="180" r="4" fill="#2f855a"/>
  <text x="420" y="214" text-anchor="middle" font-weight="600" fill="#1a1a1a">10 kΩ</text>
  <text x="420" y="160" text-anchor="middle" font-size="11" fill="#666">in series, limits the −5 V RS232 swing</text>

  <!-- USB power -->
  <line x1="730" y1="260" x2="730" y2="290" stroke="#555" stroke-width="2"/>
  <rect x="650" y="290" width="160" height="40" rx="6" fill="#f4f4f4" stroke="#555" stroke-width="1.5"/>
  <text x="730" y="315" text-anchor="middle" fill="#1a1a1a">5 V USB supply</text>

  <!-- Notes -->
  <text x="20" y="300" font-weight="600" fill="#c53030">Listen only: quick check of the boot log, not for Home Assistant.</text>
  <text x="20" y="320" fill="#444">Bridge settings: RS232 (inverted), TX off.</text>
  <text x="20" y="340" fill="#444">Never connect VSC TX straight to the ESP, and never the red bus wire (+10 V).</text>
  <text x="20" y="360" fill="#444">For logging in and Home Assistant, use the MAX3232 module.</text>
</svg>
